name: wttr_fck
description: "A free weather app that tells you the forecast and swears at you."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1

  http: ^1.6.0
  shared_preferences: ^2.5.6
  geolocator: ^14.1.2
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - content/
    - content/voices/
    - assets/fonts/OFL.txt
  fonts:
    - family: GoogleSansFlex
      fonts:
        - asset: assets/fonts/GoogleSansFlex.ttf

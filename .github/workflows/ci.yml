name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze, test, validate roasts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Validate community content
        run: flutter test test/content_test.dart --reporter expanded
      - name: All tests
        run: flutter test --exclude-tags screenshots
      - name: Web build smoke test
        run: flutter build web --release --wasm
